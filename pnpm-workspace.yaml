packages:
    - frontend
    - miniprogram
linkWorkspacePackages: false
# 脚本执行只提示依赖状态；安装统一在选定工作区根显式执行。
verifyDepsBeforeRun: warn
minimumReleaseAgeExclude:
    - "@shanjing/go-starter-devtools@0.1.11"
    - "@shanjing/shadcnui-dashboard@0.1.8"
# 原生 esbuild 安装脚本按固定版本放行；其他已审阅的生命周期脚本保持关闭。
# Taro CLI 的 postinstall 会修改用户级插件配置，项目明确关闭。
allowBuilds:
    "esbuild@0.21.5 || 0.25.12": true
    "@parcel/watcher@2.6.0": false
    "@swc/core@1.3.96": false
    "@tarojs/binding@4.2.1": false
    "@tarojs/cli@4.2.1": false
    "core-js@3.50.0": false
    "core-js-pure@3.50.0": false
# Web 与小程序使用不同 React 代际，Sentry 类型跟随消费端的 React 类型。
packageExtensions:
    "@sentry/react@11.6.0":
        peerDependencies:
            "@types/react": "*"
        peerDependenciesMeta:
            "@types/react":
                optional: true
