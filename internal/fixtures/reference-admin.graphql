input CreateOrderSetInput {
    orderNo: String!
    productId: Int!
    quantity: Int
    remark: String
    shopId: Int!
    status: String
    totalAmountInCents: Int!
    unitPriceInCents: Int!
}

input CreateProductSetInput {
    inventoryCount: Int
    name: String!
    priceInCents: Int!
    shopId: Int!
    sku: String!
    status: String
}

input CreateShopSetInput {
    name: String!
    slug: String!
    status: String
}

input CreateUserSetInput {
    email: String!
    name: String!
    password: String!
    role: String
}

"""
DateTime instant serialized as a second-level UTC ISO string. Inputs must include Z or a UTC offset in UTC mode; legacy strings without timezone use TZ when TZ is non-UTC.
"""
scalar DateTime

input DateTimeFilters {
    eq: DateTime
    gt: DateTime
    gte: DateTime
    lt: DateTime
    lte: DateTime
}

input InnerOrder {
    direction: OrderDirection!
    priority: Int!
}

input IntFilters {
    eq: Int
    gt: Int
    gte: Int
    inArray: [Int!]
    isNotNull: Boolean
    isNull: Boolean
    lt: Int
    lte: Int
    ne: Int
    notInArray: [Int!]
}

scalar JSON

type Mutation {
    createOrder(set: CreateOrderSetInput!): OrderItem!
    createProduct(set: CreateProductSetInput!): ProductItem!
    createShop(set: CreateShopSetInput!): ShopItem!
    createUser(set: CreateUserSetInput!): [UserItem!]!
    deleteOrder(where: OrderFilters!): [OrderItem!]!
    deleteProduct(where: ProductFilters!): [ProductItem!]!
    deleteShop(where: ShopFilters!): [ShopItem!]!
    deleteUser(where: UserFilters!): [UserItem!]!
    updateOrder(set: UpdateOrderSetInput!, where: OrderFilters!): [OrderItem!]!
    updateProduct(set: UpdateProductSetInput!, where: ProductFilters!): [ProductItem!]!
    updateQueueExecutionRecord(
        set: QueueExecutionRecordSetInput!
    ): QueueExecutionRecordUpdatePayload
    updateShop(set: UpdateShopSetInput!, where: ShopFilters!): [ShopItem!]!
    updateUser(set: UpdateUserSetInput!, where: UserFilters!): [UserItem!]!
}

enum OrderDirection {
    asc
    desc
}

input OrderFilters {
    createdAt: DateTimeFilters
    id: IntFilters
    orderNo: StringFilters
    productId: IntFilters
    shopId: IntFilters
    status: StringFilters
}

type OrderItem {
    createdAt: DateTime
    id: ID
    orderNo: String
    product: ProductItem
    productId: Int
    quantity: Int
    remark: String
    shop: ShopItem
    shopId: Int
    status: String
    totalAmountInCents: Int
    unitPriceInCents: Int
    updatedAt: DateTime
}

input OrderOrderBy {
    createdAt: InnerOrder
    id: InnerOrder
    orderNo: InnerOrder
    productId: InnerOrder
    quantity: InnerOrder
    shopId: InnerOrder
    status: InnerOrder
    totalAmountInCents: InnerOrder
    unitPriceInCents: InnerOrder
    updatedAt: InnerOrder
}

input ProductFilters {
    id: IntFilters
    shopId: IntFilters
    sku: StringFilters
    status: StringFilters
}

type ProductItem {
    createdAt: DateTime
    id: ID
    inventoryCount: Int
    name: String
    orderCount: Int!
    orders: [OrderItem!]
    priceInCents: Int
    shop: ShopItem
    shopId: Int
    sku: String
    status: String
    updatedAt: DateTime
}

input ProductOrderBy {
    createdAt: InnerOrder
    id: InnerOrder
    inventoryCount: InnerOrder
    name: InnerOrder
    priceInCents: InnerOrder
    shopId: InnerOrder
    sku: InnerOrder
    status: InnerOrder
    updatedAt: InnerOrder
}

type Query {
    getCurrentUser: UserItem
    getOrder(where: OrderFilters!): OrderItem
    getProduct(where: ProductFilters!): ProductItem
    getQueueDashboard: QueueDashboardPayload
    getQueueExecutionRecord(recordId: String!, statusHint: String): QueueExecutionRecord
    getQueueHealth: QueueHealthPayload
    getQueueSchedules: QueueSchedulesPayload
    getShop(where: ShopFilters!): ShopItem
    getUser(where: UserFilters!): UserItem
    listOrders(limit: Int, offset: Int, orderBy: OrderOrderBy, where: OrderFilters): [OrderItem!]
    listProducts(
        limit: Int
        offset: Int
        orderBy: ProductOrderBy
        where: ProductFilters
    ): [ProductItem!]
    listQueueExecutionRecords(
        limit: Int
        offset: Int
        orderBy: String
        orderDirection: String
        status: String!
    ): QueueExecutionRecordsPayload
    listShops(limit: Int, offset: Int, orderBy: ShopOrderBy, where: ShopFilters): [ShopItem!]
    listUsers(limit: Int, offset: Int, orderBy: UserOrderBy, where: UserFilters): [UserItem!]
}

type QueueDashboardCapabilities {
    supportsPauseState: Boolean
    supportsRetry: Boolean
    supportsSchedules: Boolean
    supportsWorkerPresence: Boolean
}

type QueueDashboardPayload {
    capabilities: QueueDashboardCapabilities
    hasOnlineWorkers: Boolean
    overview: QueueOverview
    queueCount: Int
    queues: [QueueSnapshot!]
    updatedAt: Float
    workerProcesses: [QueueWorkerProcess!]
}

type QueueExecutionRecord {
    attempts: Int
    canRetry: Boolean
    currentJobState: String
    data: JSON
    executionNumber: Int
    failedReason: String
    finishedAt: Float
    id: String
    jobId: String
    meta: JSON
    name: String
    opts: JSON
    physicalQueueName: String
    processedAt: Float
    queueName: String
    queuedAt: Float
    retryOfRecordId: String
    returnValue: JSON
    runtimeMs: Float
    stacktrace: [String!]
    state: String
    statusHint: String
}

input QueueExecutionRecordSetInput {
    recordId: String!
    statusHint: String
}

type QueueExecutionRecordSummary {
    executionNumber: Int
    finishedAt: Float
    id: String
    jobId: String
    jobName: String
    physicalQueueName: String
    processedAt: Float
    queueName: String
    queuedAt: Float
    runtimeMs: Float
    sortAt: Float
    status: String
}

type QueueExecutionRecordUpdatePayload {
    detail: QueueExecutionRecord
    noticeMessage: String
}

type QueueExecutionRecordsPayload {
    isRecentPage: Boolean
    limit: Int
    offset: Int
    records: [QueueExecutionRecordSummary!]
    status: String
    total: Int
    updatedAt: Float
}

type QueueHealthPayload {
    capabilities: QueueDashboardCapabilities
    ok: Boolean
    queueCount: Int
    scheduleCount: Int
    schedulerInstanceCount: Int
    schedulerLeader: String
}

type QueueOverview {
    active: Int
    completed: Int
    failed: Int
    onlineWorkers: Int
    waiting: Int
}

type QueueSchedule {
    cron: String
    description: String
    jobName: String
    lastActivityAt: Float
    name: String
    nextRunAt: Float
    queueName: String
    status: String
    statusText: String
    timezone: String
}

type QueueSchedulerHeartbeat {
    instanceId: String
    lastHeartbeatAt: Float
    role: String
}

type QueueSchedulesPayload {
    heartbeats: [QueueSchedulerHeartbeat!]
    scheduleCount: Int
    schedulerInstanceCount: Int
    schedulerLeader: String
    schedules: [QueueSchedule!]
    updatedAt: Float
}

type QueueSnapshot {
    active: Int
    binding: String
    completed: Int
    concurrency: Int
    delayed: Int
    description: String
    failed: Int
    isListening: Boolean
    isPaused: Boolean
    maxMemory: String
    physicalQueueName: String
    queueName: String
    waiting: Int
    workerCount: Int
    workerProcessGroup: String
    workerProcessName: String
}

type QueueWorkerProcess {
    instances: Int
    isOnline: Boolean
    maxMemory: String
    memoryBytes: Float
    name: String
    onlineInstances: Int
    processGroup: String
    queues: [String!]
}

input ShopFilters {
    id: IntFilters
    slug: StringFilters
    status: StringFilters
}

type ShopItem {
    createdAt: DateTime
    id: ID
    name: String
    orders: [OrderItem!]
    products: [ProductItem!]
    slug: String
    status: String
    updatedAt: DateTime
}

input ShopOrderBy {
    createdAt: InnerOrder
    id: InnerOrder
    name: InnerOrder
    slug: InnerOrder
    status: InnerOrder
    updatedAt: InnerOrder
}

input StringFilters {
    eq: String
    gt: String
    gte: String
    ilike: String
    inArray: [String!]
    isNotNull: Boolean
    isNull: Boolean
    like: String
    lt: String
    lte: String
    ne: String
    notIlike: String
    notInArray: [String!]
    notLike: String
}

input UpdateOrderSetInput {
    orderNo: String
    productId: Int
    quantity: Int
    remark: String
    shopId: Int
    status: String
    totalAmountInCents: Int
    unitPriceInCents: Int
}

input UpdateProductSetInput {
    inventoryCount: Int
    name: String
    priceInCents: Int
    shopId: Int
    sku: String
    status: String
}

input UpdateShopSetInput {
    name: String
    slug: String
    status: String
}

input UpdateUserSetInput {
    banExpires: DateTime
    banReason: String
    banned: Boolean
    name: String
    role: String
}

input UserFilters {
    banned: Boolean
    email: StringFilters
    emailVerified: Boolean
    id: IntFilters
    role: StringFilters
}

type UserItem {
    banExpires: DateTime
    banReason: String
    banned: Boolean
    createdAt: DateTime
    email: String
    emailVerified: Boolean
    id: ID
    image: String
    name: String
    role: String
    updatedAt: DateTime
}

input UserOrderBy {
    createdAt: InnerOrder
    email: InnerOrder
    id: InnerOrder
    name: InnerOrder
    role: InnerOrder
    updatedAt: InnerOrder
}
