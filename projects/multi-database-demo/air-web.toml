root = "."
tmp_dir = "projects/multi-database-demo/tmp/web"
[build]
cmd = "go build -o ./projects/multi-database-demo/tmp/web/main ./projects/multi-database-demo/cmd/web"
entrypoint = ["./projects/multi-database-demo/tmp/web/main"]
include_ext = ["go", "html", "js", "css"]
include_dir = ["packages/go-server-kit", "projects/multi-database-demo/cmd/web", "projects/multi-database-demo/internal", "projects/multi-database-demo/webui"]
exclude_dir = [".tools", ".runtime", "poc", "node_modules", "packages/shadcnui-dashboard", "projects/multi-database-demo/tmp", "projects/multi-database-demo/frontend", "tools"]
exclude_regex = ["_test.go$"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "6s"
[log]
time = true
[screen]
clear_on_rebuild = false
keep_scroll = true
